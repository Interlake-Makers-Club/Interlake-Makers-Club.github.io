  room: REPLACE_ME (e.g. Room 214) # TODO(Q20)

# 60 words max. Draft from the PRD; approve or replace.
mission: >- # TODO(Q19) approve or replace
  We believe a 3D printer is most useful when it's making something for someone else.
  Makers' Club is a student-run community at Interlake High School where members learn
  to design and print, then put those skills to work: free prints for people who need
  them, and hands-on demos at outreach events around the Eastside.

# Hero 3D carousel: 3 to 5 models.
#   model:     .glb file in public/models/ (3 MB max, 100k triangles max)
#   poster:    1200 × 1200 photo of the real print, in src/assets/posters/
#   caption:   40 characters max
#   color:     filament color as a hex code
#   alt:       describes the object, for screen readers
#   projectId: optional; links the caption to a project below
heroModels: # TODO(Q16)
  - model: /models/placeholder-model-1.glb
    poster: ../assets/posters/placeholder-model-1.png
    caption: Placeholder model 1
    color: "#C2410C"
    alt: Placeholder ring shape until the club's first model is added
    projectId: placeholder-project-1
  - model: /models/placeholder-model-2.glb
    poster: ../assets/posters/placeholder-model-2.png
    caption: Placeholder model 2
    color: "#303536"
    alt: Placeholder cube shape until the club's second model is added
  - model: /models/placeholder-model-3.glb
    poster: ../assets/posters/placeholder-model-3.png
    caption: Placeholder model 3
    color: "#5A6062"
    alt: Placeholder cylinder shape until the club's third model is added

